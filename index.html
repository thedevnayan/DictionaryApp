<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Dictionary - By Nayan</title>
</head>
<body>
    <h1>Dictionary</h1>

    <div class="search-bar">
        <input type="text" name="word" id="inputWord" placeholder="Search word here to find out meaning out of it">
         <i class="fa-solid fa-magnifying-glass" id="submit" ></i>
    </div>

    <div class="container">
        <h2>Word :</h2>
        <hr>
        <h3>Phonetic :</h3>
        <hr>
        <div class="part-of-speech">
            <h3>noun</h3>
        </div>
        <hr>
        <div class="meanings">
            <h4>Meaning</h4>
            <ul>
                <li>mean 1</li>
                <li>mean 2</li>
            </ul>
        </div>
        <div class="part-of-speech">
            <h3>adjective</h3>
        </div>
        <div class="meanings">
            <h4>Definition</h4>
            <ul>
                <li>define 1</li>
                <li>define 2</li>
            </ul>
        </div>

        <div class="syno">
            <h4>Synonyms :</h4>
            <ul>
                <li>Syno 1</li>
                <li>Syno 2</li>
                <li>Syno 3</li>
            </ul>
        </div>

        <div class="anto">
            <h4>antonyms :</h4>
            <ul>
                <li>Anto 1</li>
                <li>Anto 2</li>
                <li>Anto 3</li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
